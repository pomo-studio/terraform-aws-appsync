name: Terraform Cloud Example Plan

# Explicit trusted dispatch only. Never approve, apply, destroy, or use latest-run fallback.
on:
  workflow_dispatch:
    inputs:
      configuration_version:
        description: Existing speculative VCS configuration version for a reviewed commit (cv-...)
        required: true
      commit_sha:
        description: Full reviewed commit SHA in this repository
        required: true

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Queue and inspect exact plan-only run
        env:
          TFC_TOKEN: ${{ secrets.TF_API_TOKEN }}
          CV: ${{ inputs.configuration_version }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$CV" =~ ^cv-[A-Za-z0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$TFC_TOKEN"
          api() { curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $TFC_TOKEN" -H 'Content-Type: application/vnd.api+json' "https://app.terraform.io/api/v2/$1" "${@:2}"; }
          WS=$(api organizations/Pitangaville/workspaces/appsync-example)
          jq -e '.data.attributes["execution-mode"] == "remote" and .data.attributes["vcs-repo"].identifier == "pomo-studio/terraform-aws-appsync" and .data.attributes["working-directory"] == "examples/basic"' <<< "$WS" >/dev/null
          WS_ID=$(jq -r '.data.id' <<< "$WS")
          CONFIG=$(api "configuration-versions/$CV")
          jq -e '.data.attributes.status == "uploaded" and .data.attributes.speculative == true' <<< "$CONFIG" >/dev/null
          # Fail closed if the selected version is not among this workspace's 100 most recent versions.
          api "workspaces/$WS_ID/configuration-versions?page%5Bsize%5D=100" | jq -e --arg cv "$CV" 'any(.data[]; .id == $cv)' >/dev/null
          api "configuration-versions/$CV/ingress-attributes" | jq -e --arg sha "$SHA" '.data.attributes["commit-sha"] == $sha' >/dev/null
          PAYLOAD=$(jq -n --arg ws "$WS_ID" --arg cv "$CV" --arg sha "$SHA" '{data:{type:"runs",attributes:{message:("Reviewed example plan " + $sha),"plan-only":true,"auto-apply":false,"is-destroy":false},relationships:{workspace:{data:{type:"workspaces",id:$ws}},"configuration-version":{data:{type:"configuration-versions",id:$cv}}}}}')
          RUN_ID=$(api runs -X POST -d "$PAYLOAD" | jq -er '.data.id')
          echo "Plan: https://app.terraform.io/app/Pitangaville/workspaces/appsync-example/runs/$RUN_ID"
          for _ in $(seq 1 100); do
            RUN=$(api "runs/$RUN_ID")
            STATUS=$(jq -r '.data.attributes.status' <<< "$RUN")
            case "$STATUS" in
              planned_and_finished)
                PLAN_ID=$(jq -er '.data.relationships.plan.data.id' <<< "$RUN")
                api "plans/$PLAN_ID" | jq -e '.data.attributes | .status == "finished" and .["resource-destructions"] == 0' >/dev/null
                echo "PASS: exact candidate plan completed without destroys. No apply was performed."
                exit 0 ;;
              errored|canceled|force_canceled|discarded) echo "Plan failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out; inspect the linked plan-only run. No apply will occur."
          exit 1
